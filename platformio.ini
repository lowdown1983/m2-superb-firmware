; M2 + SuperB multi-mode firmware — PlatformIO project.
; Two environments, one per chip. Build one with `pio run -e m2`,
; the other with `pio run -e superb`, or both with plain `pio run`.
;
; HARDWARE RULE (verified, immutable): the M2<->SuperB Bee link is the M2's
; `Serial` (XBEE_RX=PA8/Arduino 0, XBEE_TX=PA9/Arduino 1) at 115200 bps.
; That rate is never parameterized anywhere in this project.

[platformio]
default_envs = m2, superb
; NOTE: the old `jobs = 16` line was removed — current PlatformIO Core no
; longer accepts `jobs` in [platformio] ("Ignore unknown configuration
; option"). PIO now sizes its own job pool, which already saturates the
; 7800X3D (8C/16T).
; BAZZITE NOTE: PlatformIO must be able to SEE the M2's USB serial port.
; - VS Code Flatpak path: `flatpak override --device=all com.visualstudio.code`
;   (else /dev/ttyACM* is invisible inside the sandbox and uploads fail).
; - distrobox path: create the container with
;   `--additional-flags "--device-cgroup-rule='c 166:* rmw'"` (ttyACM class).
; - Host-level: user in `dialout` group, ModemManager disabled (or udev-ignored
;   for 2341:003e / 03eb:6124). Full procedure + diagnostics: SETUP.md §1/§1b
;   and scripts/bazzite-usb-check.sh.

; ---------------------------------------------------------------------------
; Macchina M2 — Atmel SAM3X8E, Arduino framework.
; Uses the REAL Macchina M2 variant (variants/m2/, copied verbatim from
; Macchina's official arduino-boards-sam repo, the same source our hardware
; audit verified). Wired in via build.variants_dir + build.variant in
; boards/macchina_m2.json — no Due-variant fallback needed.
; Upload: bossac over the M2's native USB port (Due-style 1200bps touch).
; ---------------------------------------------------------------------------
[env:m2]
platform = atmelsam
board = macchina_m2
framework = arduino
; Per-firmware source selection: only src/m2/ is built for this env.
build_src_filter = +<m2/*> -<superb/*>
monitor_speed = 115200
; The SAM core's CDC driver silently DROPS all USB output unless the host
; asserts DTR (lineState==0). pio's monitor doesn't by default, which made
; the firmware look dead. Assert it.
monitor_dtr = 1
monitor_rts = 1
; CAN libraries. Pins are exact (no floating ranges) for reproducibility.
; - due_can 2.1.6 needs can_common explicitly: it #includes <can_common.h>
;   but declares no PIO dependency.
; - macchina/MCP2515 is the base class for the vendored SWcan library
;   (lib/SWcan, Macchina's Single-Wire-CAN-mcp2515, MIT).
; - SWcan (lib/SWcan) is vendored, not from the registry, because no
;   registry package provides SWcan::setupSW()/mode().
lib_deps =
    ; due_can is VENDORED in lib/due_can (fork of collin80/due_can@2.1.6
    ; with the 8-TQ SJW constraint fix; see lib/due_can/README.md).
    collin80/can_common@0.4.0
    macchina/MCP2515@0.3.1

; ---------------------------------------------------------------------------
; SuperB — ESP32-WROOM-32D, Arduino framework.
; Flash size VERIFIED by Marcus 2026-10-12: 4MB (stock esp32dev layout).
; In the Bee socket, Serial = UART0 (GPIO3=RX, GPIO1=TX) = the Bee link.
; ---------------------------------------------------------------------------
[env:superb]
platform = espressif32
board = esp32dev
framework = arduino
; Per-firmware source selection: only src/superb/ is built for this env.
build_src_filter = +<superb/*> -<m2/*>
monitor_speed = 115200
; Phase 11: custom 4 MB OTA partition table (two ~1.9 MB app slots, NVS,
; otadata, small SPIFFS). Replaces huge_app.csv (no OTA slot).
; ASSUMPTION (INFERRED): 4 MB flash on the WROOM-32D module — the standard
; size; the hardware audit still lists flash size as an open question.
; First flash after this change rewrites the partition table; a full
; erase_flash is the clean recovery if the layout ever disagrees.
board_build.partitions = partitions/superb_ota_4m.csv
; Phase 11: WebSocket server (raw stream + GVRET framing) alongside TCP:23.
lib_deps =
    links2004/WebSockets@^2.7.3

; ---------------------------------------------------------------------------
; SIMULATION — host-native harness (docs/SIM.md). ADDITIVE ONLY.
; These envs compile the UNMODIFIED firmwares (src/m2/*, src/superb/*)
; against sim shims (src/sim_shim/*, src/sim_shim_esp/*) instead of real
; Arduino cores, and run them as Linux programs on the workstation.
; Evidence: VERIFIED = compiles/runs on host. INFERRED = simulated
; hardware standing in for silicon (no cycle-accurate CAN/J1850, no
; vehicle behavior — deferred, see docs/SIM.md).
; The existing [env:m2]/[env:superb] sections above are untouched: their
; build_src_filter never matches sim_shim*, and -I src/sim_shim* is only set
; here, so <Arduino.h> still resolves to the real cores for hardware.
; ---------------------------------------------------------------------------
[env:sim_m2]
platform = native
build_src_filter = +<m2/*> +<sim_shim/*> -<superb/*> -<sim_shim_esp/*>
build_flags =
    -I src/sim_shim
    -DSIM_M2
    -std=gnu++17

[env:sim_superb]
platform = native
build_src_filter = +<superb/*> +<sim_shim/*> +<sim_shim_esp/*> -<m2/*>
build_flags =
    -I src/sim_shim
    -I src/sim_shim_esp
    -DSIM_SUPERB
    -std=gnu++17

; ---------------------------------------------------------------------------
; BRINGUP — M2 hardware boot diagnostic (NOT production firmware).
; Boots the real ModeManager with a marker print after each stage, so one
; flash shows exactly where the silicon stops. See src/bringup/main.cpp.
; Remove the SuperB from the Bee socket for this test.
; Build+upload: pio run -e bringup -t upload --upload-port /dev/ttyACM0
; ---------------------------------------------------------------------------
[env:bringup]
platform = atmelsam
board = macchina_m2
framework = arduino
build_src_filter = +<bringup/*> +<m2/*> -<m2/main.cpp>
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
lib_deps =
    ; due_can is VENDORED in lib/due_can (fork of collin80/due_can@2.1.6
    ; with the 8-TQ SJW constraint fix; see lib/due_can/README.md).
    collin80/can_common@0.4.0
    macchina/MCP2515@0.3.1
